migration_validation:
  baostock_cache_root: "data/cache/_partial"
  certified_audit_path: "audit/migration_validation.json"
  allow_certified_audit_without_reference: true
  minimum_reference_securities: 1000
  price_relative_tolerance: 0.001
  minimum_open_close_sign_agreement: 0.995
  minimum_close_preclose_sign_agreement: 0.990
  minimum_suspension_agreement: 0.990
  minimum_signal_agreement: 0.950

strategy:
  headline_model: "model2"
  rolling_window: 3
  state_window: 5
  signal_rule: "delta_sse50_minus_delta_csi500"
  zero_signal_policy: "hold"
  weights:
    sse50_long: 0.40
    csi500_short: -0.40
    cash: 0.20

backtest:
  signal_at: "close"
  execute_at: "next_close"
  execution_delay_sessions: 1
  one_way_cost_bps: 5.0
  annualization_days: 252
  risk_free_rate: 0.0
  initial_nav: 1.0
  benchmark: "equal_weight_sse50_csi500"

outputs:
  directory: "results"
  equity_curve: "equity_curve.csv"
  positions: "positions.csv"
  trades: "trades.csv"
  sentiment: "sentiment.csv"
  signals: "signals.csv"
  metrics: "metrics.json"
  migration_validation: "migration_validation.json"
  provenance: "data_provenance.json"
  resolved_config: "resolved_config.yaml"
  report_payload: "report.json"
  report_html: "report.html"

automation:
  artifact_retention_days: 30
  required_secrets: []
