name: Real-data backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 5 * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/backtest.yml"
      - "audit/**"
      - "config/**"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - "run.py"

permissions:
  contents: write

concurrency:
  group: real-backtest-main
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Remove historical result files
        run: find results -type f -delete

      - name: Validate project configuration
        run: python run.py validate

      - name: Download real bundle and rebuild official PIT membership
        run: python run.py fetch --refresh

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Run full real-data backtest
        run: python run.py all

      - name: Validate self-contained report and artifacts
        run: python run.py validate-report

      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-model-real-backtest-${{ github.run_id }}
          path: |
            results/
            audit/migration_validation.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push generated results to main
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force results audit/migration_validation.json
          if git diff --cached --quiet; then
            echo "Expected regenerated result changes, but the index is unchanged." >&2
            exit 1
          fi
          git commit -m "chore: update real backtest results (run ${RUN_ID}) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
